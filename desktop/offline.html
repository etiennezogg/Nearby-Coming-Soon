<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keine Verbindung — Nearby</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0d0d0d; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background-image: radial-gradient(circle at 20% 0%, rgba(26,158,116,0.22), transparent 55%);
    }
    main { max-width: 440px; text-align: center; }
    .zeichen { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #22c55e; margin-bottom: 28px; }
    /* Zusatz «ZOGG» unten rechts an der Wortmarke, siehe components/Zogg.tsx und globals.css */
    .zogg-anker { position: relative; top: 0.24em; display: inline-block; width: 0; height: 0; }
    .zogg { position: absolute; right: 0; top: 0; margin: 0.16em -0.2em 0 0; font-size: max(0.4em, 8px); font-weight: 700; letter-spacing: 0.2em; line-height: 1; text-transform: uppercase; white-space: nowrap; }
    h1 { font-size: 26px; line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em; }
    p { margin: 0 0 28px; color: rgba(255,255,255,0.55); line-height: 1.6; font-size: 15px; }
    button {
      font: inherit; font-size: 14px; font-weight: 600; color: #0d0d0d; background: #22c55e;
      border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .klein { margin: 18px 0 0; font-size: 13px; color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <main>
    <div class="zeichen">Nearby<span class="zogg-anker"><span class="zogg">Zogg</span></span></div>
    <h1>Keine Verbindung</h1>
    <p>Nearby zeigt Geschäfte und Produkte in deiner Nähe und braucht dafür Internet. Sobald du wieder online bist, geht es von selbst weiter.</p>
    <button id="neu" type="button">Nochmals versuchen</button>
    <p class="klein">Deine Anmeldung bleibt auf diesem Gerät gespeichert.</p>
  </main>
  <script>
    (function () {
      // Die Adresse, zu der es zurückgehen soll, gibt das Programm vor (main.js).
      var ziel = new URLSearchParams(location.search).get('ziel') || '';
      if (!/^https?:\/\//i.test(ziel)) ziel = '';
      function los() { if (ziel) location.href = ziel; }
      document.getElementById('neu').addEventListener('click', los);
      window.addEventListener('online', los);
      // Alle paar Sekunden still nachsehen, ob die Seite wieder antwortet.
      setInterval(function () {
        if (!ziel) return;
        fetch(ziel, { mode: 'no-cors', cache: 'no-store' }).then(los).catch(function () {});
      }, 8000);
    })();
  </script>
</body>
</html>
